name: Bug report
description: The tool got something wrong, crashed, or refused to do something it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ## Never attach real data

        This is a public repository and a tax filing is about as sensitive as personal data
        gets. **Do not attach a broker export, a filled return, an audit CSV from your own
        `work/`, an account statement, or a screenshot of any of them.** Not as a file, not
        pasted into a code block, not in a follow-up comment.

        That includes your **PAN, Aadhaar, account numbers, real holdings, quantities, prices
        and dates.** An issue cannot be un-published: editing a comment leaves the original
        in the edit history, and deleting the issue does not remove it from anyone's inbox.

        **Reproduce it on the synthetic data instead.** `tests/synthetic/` and
        `tests/synthetic_split/` are invented datasets that ship with the repository, and a
        bug that reproduces against one of them is a bug we can actually fix:

        ```bash
        .venv/bin/python -m itrprep.cli build --year 2025 --work tests/synthetic --out /tmp/demo.json
        ```

        If it only reproduces on your own data, **describe the shape of the input** — a column
        that was named something unexpected, a row type the adapter did not recognise, two
        lots with the same date — and invent figures that have the same shape. Replace every
        real number. A redaction that misses one field is worse than an invention, because
        nobody re-reads a redacted file looking for what survived.
  - type: checkboxes
    id: no-real-data
    attributes:
      label: Before you post
      options:
        - label: There is no PAN, Aadhaar, account number, or real holding, quantity, price or date anywhere in this issue or its attachments.
          required: true
        - label: I have not attached a broker export, a filled return, or a screenshot of either.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: >
        The full command, with paths replaced if you like. Include the flags -- especially
        --split-basis, --peak-basis and --offline, which change the figures.
      render: shell
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: What it printed
      description: >
        The error or the wrong figure, with any real values replaced. If it was a traceback,
        the whole traceback.
      render: shell
    validations:
      required: true
  - type: input
    id: reproduces-on-synthetic
    attributes:
      label: Does it reproduce on the synthetic data?
      description: "yes / no / did not try. If yes, say which dataset and year."
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Version and platform
      description: >
        Output of `.venv/bin/python -m itrprep.cli --version`, your OS, and your Python
        version. If the problem is in `itr-prep import`, say which utility file and which
        Excel.
    validations:
      required: true
