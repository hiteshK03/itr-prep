name: tests

on:
  push:
    branches: [main]
  pull_request:
  # The rules registry goes stale by the calendar rather than by anyone touching the code, so
  # something has to notice when nobody is pushing. First of the month, 06:00 UTC.
  schedule:
    - cron: "0 6 1 * *"

permissions:
  contents: read

jobs:
  suites:
    name: suites (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Everything except `itr-prep import` is plain Python, and this is where that
          # claim is checked rather than asserted. macOS is the case that matters: it is
          # the platform with no route to the department's Excel utility, so it is the
          # one where the boundary has to hold. There is deliberately no Windows job --
          # the only thing it could add is the import step, and that needs Excel and a
          # copy of the utility, neither of which belongs in CI.
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          # The unlock extras, so the credential suite runs its encrypted round-trips here
          # rather than skipping them. That suite is the proof a password cannot leak, and
          # a proof that skips in CI is not one.
          python -m pip install -r requirements-unlock.txt

      - name: Warm the offline caches
        # The suites run offline, but "offline" means "reads a cache", and a fresh
        # checkout has none: data/ is gitignored because it is derived, and because a
        # real user's cached tickers say what they hold. So build it here. `fx-update`
        # fetches the SBI TT-buy series; the two threshold runs walk every ticker-year
        # the fixtures touch, which is what the suites then read with --offline.
        run: |
          python -m itrprep.cli fx-update
          python -m itrprep.cli threshold --work tests/synthetic --years 2022-2025 \
            --out "$RUNNER_TEMP/warm-synthetic.txt"
          python -m itrprep.cli threshold --work tests/synthetic_split --years 2022-2025 \
            --split-basis current --out "$RUNNER_TEMP/warm-split.txt"

      - name: Suites
        # Plain scripts, no runner. Each collects its failures and exits non-zero, so a
        # single failure fails the job and names every check that went wrong.
        run: |
          status=0
          ran=0
          asserted=0
          for t in tests/test_*.py; do
            echo "::group::$t"
            if python "$t" > "$RUNNER_TEMP/suite.out" 2>&1; then :; else status=1; fi
            cat "$RUNNER_TEMP/suite.out"
            ran=$((ran + 1))
            # Counting files that ran cannot tell "8 passed" from "7 passed and 1 did
            # nothing": a suite that skips in full exits 0 and looks identical. Every suite
            # ends with a single `All ... ` line summarising what it asserted, and a suite
            # that skipped never prints one. That is the difference this checks.
            if grep -qE '^All ' "$RUNNER_TEMP/suite.out"; then
              asserted=$((asserted + 1))
            else
              echo "::error::$t exited without a summary line, so it asserted nothing"
              status=1
            fi
            echo "::endgroup::"
          done
          # A suite that is absent from the checkout passes vacuously, which is how
          # test_unlock_credentials.py went missing for a while: it matched a
          # `*_credentials*` line in .gitignore and was never committed. Count them.
          if [ "$ran" -ne 8 ]; then
            echo "::error::expected 8 suites, ran $ran -- one is missing from the checkout"
            exit 1
          fi
          if [ "$asserted" -ne 8 ]; then
            echo "::error::8 suites ran but only $asserted asserted anything"
            exit 1
          fi
          exit $status

  hygiene:
    name: no real data in the tree or its history
    runs-on: ubuntu-latest
    # Its own job rather than a step inside the matrix, because it needs the whole history and
    # the suites do not. A .env or a real PAN committed once stays readable through
    # `git log -p` forever, so checking only the tree checked the easy half.
    steps:
      - uses: actions/checkout@v4
        with:
          # Default is depth 1, which would silently reduce the history scan to one commit.
          # The script fails on a shallow clone rather than quietly covering less, but this
          # is what makes it able to do the job at all.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # No dependencies: the check is stdlib only, so it cannot be broken by an install
      # failure and contributors can run it on a bare checkout.
      #
      # --self-test plants each kind of leak in a throwaway repository and asserts it is
      # caught, then checks this one. A hygiene check nobody tests is one that quietly stops
      # working, and this repository has already had that happen to a whole test suite.
      - run: python scripts/check_no_real_data.py --self-test

  sources:
    name: cited sources still resolve
    runs-on: ubuntu-latest
    # Network-dependent, so it must not be able to fail a pull request. It exists to notice
    # when the department moves a page, which is a maintenance signal and not a defect.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # This job had never once checked a URL. It ran the suite without installing anything,
      # so it died on `import requests` before reaching the first HEAD -- and because it is
      # continue-on-error, it failed silently on every run since the initial commit. A
      # maintenance signal that cannot fire is not a maintenance signal.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Warm the FX cache
        # The suite reads data/sbi_ttbuy_usd.csv to drive a sale across the long-term
        # threshold, and it does that before it reaches the URL block. data/ is gitignored,
        # so without this the run dies at FxRates.load having HEADed nothing at all. That
        # is this job's whole history: it failed on a missing install, and once that was
        # fixed it failed one step later on a missing cache. Both times it checked no URL.
        run: python -m itrprep.cli fx-update
      - name: HEAD every URL in the rules registry
        env:
          ITRPREP_CHECK_SOURCE_URLS: "1"
        run: |
          status=0
          python tests/test_rules_registry.py > "$RUNNER_TEMP/sources.out" 2>&1 || status=1
          cat "$RUNNER_TEMP/sources.out"
          # A page that moved and a job that broke both look like a red X on a job nobody
          # is allowed to let fail a pull request. Only one of them is the signal this job
          # exists for. The URL block prints one line per distinct cited URL, so an absence
          # of those lines means the run never got that far, whatever else it reported.
          if ! grep -qE '^  (ok|FAIL) +.*does not report the page gone' \
                "$RUNNER_TEMP/sources.out"; then
            echo "::error::this job ended before HEADing a single URL, so no cited source" \
                 "was checked -- fix the job, do not read this as a moved page"
            exit 1
          fi
          exit $status

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ruff
      - run: ruff check .
